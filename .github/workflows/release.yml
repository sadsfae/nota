name: Release

# Semantic versioning: create a GitHub release from a vMAJOR.MINOR.PATCH tag.
# Tag the current main with `git tag vX.Y.Z && git push origin vX.Y.Z`, keeping
# manifest.json `version` in sync.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
