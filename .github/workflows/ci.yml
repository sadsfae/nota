name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QML linter
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev
      - name: Run release checks
        run: bash tests/test-release.sh
